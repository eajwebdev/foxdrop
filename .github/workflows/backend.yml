name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: foxdrop
          POSTGRES_PASSWORD: foxdrop
          POSTGRES_DB: foxdrop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foxdrop" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: foxdrop_test
      DB_USERNAME: foxdrop
      DB_PASSWORD: foxdrop
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, intl, mbstring, bcmath, sodium, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest (real PostgreSQL + PostGIS)
        run: vendor/bin/pest

      - name: Composer audit
        run: composer audit

      # Admin web (§20.7): lint, types, unit tests, build, then the Playwright E2E against the real server.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run types

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm run test

      - name: Vite build
        run: npm run build

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Playwright E2E (sign-in + 2FA, approve operator, record payment)
        run: |
          php artisan migrate:fresh --seed --drop-types --drop-views --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/up > /dev/null && break; sleep 2; done
          npm run e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/playwright-report
          retention-days: 7
