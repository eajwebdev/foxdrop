name: Backend

on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["supabase/**"]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start local stack
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Lint database
        run: supabase db lint --level warning --fail-on error

      # pgTAP: RLS isolation and money functions (from Phase 1)
      - name: pgTAP
        if: hashFiles('supabase/tests/**/*.sql') != ''
        run: supabase test db

  # Edge Functions start in Phase 2/3; the steps skip until the first one exists.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        if: hashFiles('supabase/functions/**/*.ts') != ''
        with:
          deno-version: v2.x
      - if: hashFiles('supabase/functions/**/*.ts') != ''
        run: deno lint supabase/functions
      - if: hashFiles('supabase/functions/**/*.ts') != ''
        run: deno test --allow-env --allow-net=127.0.0.1 supabase/functions
