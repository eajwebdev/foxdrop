name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * 0" # weekly, Monday 06:00 Asia/Manila

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
